services:
  # Android build environment
  # Kept running. Exec into it: docker compose exec build bash
  build:
    build:
      context: .
      dockerfile: Dockerfile
    image: clawdroid-build:latest
    volumes:
      - $PWD:$PWD
      - gradle_cache:/root/.gradle
    working_dir: $PWD
    environment:
      - GRADLE_OPTS=-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
    cpus: ${CPUS:-4}
    mem_limit: ${MEM_LIMIT:-4G}
    network_mode: host
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: /bin/bash

  # Android emulator via Redroid (requires kernel modules on host)
  # Start with: docker compose --profile emulator up
  emulator:
    image: redroid/redroid:12.0.0_64only-latest
    privileged: true
    ports:
      - '5555:5555'
    volumes:
      - android_data:/data
    environment:
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_net_nds=1
    profiles:
      - emulator
    restart: unless-stopped

volumes:
  gradle_cache:
  android_data:
